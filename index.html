<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EP Daily View</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Daily View">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#ffffff">
  <style>
    :root { color-scheme: light; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #ffffff;
      color: #202124;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 32px 24px;
      box-sizing: border-box;
    }
    img.logo {
      width: 120px;
      height: 120px;
      border-radius: 24px;
      border: 1px solid #e6e6e6;
    }
    h1 {
      margin: 20px 0 8px;
      font-size: 22px;
      letter-spacing: 0.02em;
    }
    p { margin: 0 0 12px; line-height: 1.45; max-width: 22em; color: #343638; }
    .btn {
      display: inline-block;
      margin-top: 12px;
      padding: 12px 22px;
      background: #202124;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }
    .hint { font-size: 14px; color: #5f6368; }
  </style>
  <script>
    (function () {
      var appUrl = "https://script.google.com/macros/s/AKfycby4PNnqwViiprAyqC-U8HXJkxS1oofaZw11E5moLLoZhTvwSwZe-rwJM42b9jgGGK9g/exec";
      var standalone = window.navigator.standalone === true ||
        (window.matchMedia && (
          window.matchMedia("(display-mode: standalone)").matches ||
          window.matchMedia("(display-mode: fullscreen)").matches ||
          window.matchMedia("(display-mode: minimal-ui)").matches
        ));
      if (standalone) {
        location.replace(appUrl);
      }
    })();
  </script>
</head>
<body>
  <img class="logo" src="apple-touch-icon.png" width="180" height="180" alt="Economos Properties">
  <h1>EP Daily View</h1>
  <p>Add this page to your Home Screen in Safari, then open it from the icon to load Daily View.</p>
  <p class="hint">Tap Share, then Add to Home Screen, and keep Open as Web App on.</p>
  <a class="btn" href="https://script.google.com/macros/s/AKfycby4PNnqwViiprAyqC-U8HXJkxS1oofaZw11E5moLLoZhTvwSwZe-rwJM42b9jgGGK9g/exec">Open Daily View</a>
</body>
</html>
